# Test Database Configuration
# Sử dụng H2 in-memory database cho testing
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (for debugging tests if needed)
spring.h2.console.enabled=false

# Logging
logging.level.org.springframework=INFO
logging.level.com.example.backend=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# OpenAI/AI Configuration for Testing
# Use test API key or mock values
openai.api.key=${OPENAI_API_KEY:test-api-key-for-testing}
openai.api.base-url=${OPENAI_API_BASE_URL:https://api.openai.com/v1}
