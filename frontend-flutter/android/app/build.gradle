plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.example.todo_flutter"

    // 1. Sửa compileSdk lên 35
    compileSdk = 35  // <--- SỬA DÒNG NÀY (Cũ: flutter.compileSdkVersion)

    // 2. Thêm phiên bản NDK cụ thể
    ndkVersion = "25.1.8937393" // <--- SỬA DÒNG NÀY (Cũ: flutter.ndkVersion)

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17.toString()
    }

    defaultConfig {
        applicationId = "com.example.todo_flutter"

        // 3. Sửa minSdk lên 24
        minSdk = 24  // <--- SỬA DÒNG NÀY (Cũ: flutter.minSdkVersion)

        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}